version: '2'

services:
    web:
        image: nginx
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./src:/src
            - ./site.conf:/etc/nginx/conf.d/default.conf
            #- ./nginx/:/etc/nginx/
            - ./nginx/tab160.com.pem:/etc/nginx/tab160.com.pem
            - ./nginx/tab160.com.key:/etc/nginx/tab160.com.key
        networks:
            - code-network
        depends_on:
            - php
    php:
        #image: php:fpm
        build:
            context: ./dockerfiles/
            dockerfile: ./Dockerfile
        environment:
            POSTGRES_PASS: ${POSTGRES_PASS}
        volumes:
            - ./src:/src
        networks:
            - code-network
        extra_hosts:
            - "host.docker.internal:172.17.0.1"
    db:
        image: postgres
        ports: 
            - "5432:5432"
        restart: always
        environment:
            #server: db
            #username: postgres
            POSTGRES_PASSWORD: ${POSTGRES_PASS}
            #database: postgres
        volumes:
            #- ./src:/src
            - ./postgres-data:/var/lib/postgresql
        networks:
            - code-network
    adminer:
        image: adminer
        restart: always
        ports:
            - 5678:8080
        networks:
            - code-network

networks:
    code-network:
        driver: bridge